name: Build MorfoCat

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Python deps + build sidecar
        shell: bash
        run: |
          pip install -r python/requirements.txt
          pip install pyinstaller
          python -m PyInstaller --onefile --name morfocat-sidecar \
            --distpath src-tauri/binaries \
            --workpath python/build \
            --specpath python \
            --noconfirm python/sidecar.py
          TRIPLE=$(rustc -vV | grep host | cut -d' ' -f2)
          EXT="${{ matrix.platform == 'windows-latest' && '.exe' || '' }}"
          mv "src-tauri/binaries/morfocat-sidecar${EXT}" "src-tauri/binaries/morfocat-sidecar-${TRIPLE}${EXT}"

      - name: Install npm deps
        run: npm ci

      # Builds the bundles without touching GitHub Releases; publishing happens
      # in the release job below, after the Windows installers have been signed.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target -path "*/release/bundle/*" \
            \( -name "*.msi" -o -name "*-setup.exe" -o -name "*.dmg" \
               -o -name "*.deb" -o -name "*.AppImage" \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload bundles
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  # Free code signing for open-source projects, via SignPath Foundation.
  # SignPath verifies that the artifact really came from this repository's
  # workflow run, so signing has to happen in CI rather than on a laptop.
  #
  # Inert until the project is approved and these are set in the repository:
  #   Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
  #              SIGNPATH_POLICY_SLUG
  #   Secret:    SIGNPATH_API_TOKEN
  sign-windows:
    needs: build
    runs-on: ubuntu-latest
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    steps:
      - name: Fetch Windows bundles
        uses: actions/download-artifact@v4
        id: download
        with:
          name: bundles-windows-latest
          path: unsigned

      - name: Re-upload for signing
        id: reupload
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: unsigned/*

      - name: Submit to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.reupload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Replaces the unsigned Windows bundles the release job would otherwise use.
      - name: Upload signed bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows-signed
          path: signed/*
          if-no-files-found: error

  release:
    needs: [build, sign-windows]
    # Runs when signing was skipped, so an unconfigured repo still releases -
    # but never when signing was attempted and failed, which would quietly
    # publish unsigned installers.
    if: >-
      always()
      && needs.build.result == 'success'
      && needs['sign-windows'].result != 'failure'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: bundles-*
          merge-multiple: false

      # Prefer the signed Windows installers when the signing job produced them.
      - name: Choose bundles
        shell: bash
        run: |
          mkdir -p release
          if [ -d all/bundles-windows-signed ]; then
            cp all/bundles-windows-signed/* release/
          elif [ -d all/bundles-windows-latest ]; then
            cp all/bundles-windows-latest/* release/
          fi
          for dir in all/bundles-macos-latest all/bundles-ubuntu-22.04; do
            if [ -d "$dir" ]; then cp "$dir"/* release/; fi
          done
          ls -la release

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MorfoCat ${{ github.ref_name }}"
          generate_release_notes: true
          draft: true
          files: release/*
